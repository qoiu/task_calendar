name: task_calendar
description: "Qoiu Tasks"
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  intl: any
  flutter_svg: any
  sqflite: ^2.3.3+1
  infinite_scroll_pagination: any
  smooth_page_indicator: ^1.2.1
  dotted_line: ^3.2.3
  flutter_color_picker_plus: any
  auto_size_text: ^3.0.0
  shared_preferences: ^2.5.5

  qoiu_utils:
    git:
      url:  https://github.com/qoiu/flutter_libs
      path: qoiu_utils

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: any

#flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: 'ic_launcher_release'
  ios: true
  image_path: "assets/QT_logo.jpg"


flutter:
  generate: true

  assets:
    - assets/
    - assets/svg/

  uses-material-design: true

