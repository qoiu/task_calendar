name: task_calendar
description: "Qoiu Tasks"
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  intl: any
  flutter_svg: any
  sqflite: ^2.3.3+1
  infinite_scroll_pagination: any
  app_tutorial: ^1.0.6
  flutter_local_notifications: ^19.3.1
  flutter_timezone: ^4.1.1
  flutter_native_timezone_updated_gradle: ^2.0.3
  android_alarm_manager_plus: any

  qoiu_utils:
    git:
      url:  https://github.com/qoiu/flutter_libs
      path: qoiu_utils

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  generate: true

  assets:
    - assets/svg/

  uses-material-design: true

